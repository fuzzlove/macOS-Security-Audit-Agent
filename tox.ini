[tox]
envlist = py39-doctor,py310,py311,py312,py313,py314-headless
skip_missing_interpreters = true

[testenv]
deps = -r requirements-test.txt
commands =
    python -m pytest -q tests/test_runtime_detection.py tests/test_capability_registry.py tests/test_safe_imports.py tests/test_fallbacks.py tests/test_headless_import_boundaries.py tests/test_protection_installation.py

[testenv:py39-doctor]
basepython = python3.9
deps =
    tomli>=2,<3
commands =
    python launcher.py --doctor --json
    python -m mac_audit_agent --doctor --json

[testenv:py314-headless]
basepython = python3.14
setenv = MSAA_NO_DIALOGS=1
commands =
    python -m mac_audit_agent --doctor --json
    python -m mac_audit_agent.protection doctor --json
    python -m pytest -q tests/test_runtime_detection.py tests/test_capability_registry.py tests/test_safe_imports.py tests/test_fallbacks.py tests/test_headless_import_boundaries.py
